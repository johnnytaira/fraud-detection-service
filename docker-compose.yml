services:
  lb:
    image: nginx:stable-alpine
    container_name: lb
    ports:
      - "9999:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 100m
    cpus: 0.3

  api1:
    build:
      context: .
    container_name: api1
    environment:
      - PORT=8080
    mem_limit: 125m
    cpus: 0.35

  api2:
    build:
      context: .
    container_name: api2
    environment:
      - PORT=8080
    mem_limit: 125m
    cpus: 0.35
